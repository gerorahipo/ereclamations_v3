services:
  # ──────────────────────────────────────────────
  # PostgreSQL 15
  # ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ereclamations_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    networks:
      - ereclamations_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # PHP 8.3 FPM
  # ──────────────────────────────────────────────
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    container_name: ereclamations_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: db
      DB_USER: db
      DB_PASSWORD: db
      JWT_SECRET: "ereclamations_cnps_secret_2026_change_me_in_production"
      APP_ENV: development
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ereclamations_net

  # ──────────────────────────────────────────────
  # Nginx
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ereclamations_nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - ereclamations_net

  # ──────────────────────────────────────────────
  # Node 20 (frontend dev server)
  # ──────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: ereclamations_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: "http://nginx"
    networks:
      - ereclamations_net

volumes:
  pgdata:

networks:
  ereclamations_net:
    driver: bridge
