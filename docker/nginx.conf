server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # Toutes les requêtes /api/* → index.php
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Résolveur DNS interne de Docker
    resolver 127.0.0.11 valid=30s;

    location ~ \.php$ {
        set $upstream_php php;
        fastcgi_pass $upstream_php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/ereclamations_access.log;
    error_log  /var/log/nginx/ereclamations_error.log;
}
