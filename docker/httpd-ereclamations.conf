# ============================================================
# Configuration Apache — eRéclamations CNPS CI
# Fichier à inclure dans httpd.conf ou httpd-vhosts.conf XAMPP
#
# Chemin par défaut XAMPP : C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# Architecture des ports :
#   - 81   : Frontend React (accessible réseau)
#   - 9000 : Backend PHP API (127.0.0.1 uniquement — non exposé)
#
# Prérequis dans httpd.conf :
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
# ============================================================

# ── Écouter sur les deux ports ─────────────────────────────
Listen 81
Listen 127.0.0.1:9000

# ── VirtualHost Backend PHP (port 9000 — localhost uniquement) ──
<VirtualHost 127.0.0.1:9000>
    ServerName localhost
    DocumentRoot "C:/inetpub/ereclamations/backend/public"

    <Directory "C:/inetpub/ereclamations/backend/public">
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Bloquer l'accès direct aux fichiers sensibles
    <FilesMatch "^\.env$">
        Require all denied
    </FilesMatch>

    # Logs séparés pour le backend
    ErrorLog  "C:/xampp/apache/logs/ereclamations-api-error.log"
    CustomLog "C:/xampp/apache/logs/ereclamations-api-access.log" combined
</VirtualHost>

# ── VirtualHost Frontend React (port 81 — réseau) ──────────
<VirtualHost *:81>
    ServerName localhost
    DocumentRoot "C:/inetpub/ereclamations/frontend/dist"

    <Directory "C:/inetpub/ereclamations/frontend/dist">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy /api/* vers le backend PHP (interne)
    ProxyPreserveHost Off
    ProxyPass        /api/ http://127.0.0.1:9000/api/
    ProxyPassReverse /api/ http://127.0.0.1:9000/api/

    # Logs séparés pour le frontend
    ErrorLog  "C:/xampp/apache/logs/ereclamations-error.log"
    CustomLog "C:/xampp/apache/logs/ereclamations-access.log" combined
</VirtualHost>
